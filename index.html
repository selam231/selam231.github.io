<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valorant Split - Takımlı FPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0f1923; font-family: 'Segoe UI', Tahoma, sans-serif; }

    #game-container { width: 100vw; height: 100vh; position: relative; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 4px #00ffcc;
    }
    #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
    #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }

    /* HUD */
    #hud {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 10; color: white;
    }

    .hud-box {
      background: rgba(15, 25, 35, 0.9);
      border: 2px solid #ff4655;
      padding: 12px 20px; border-radius: 6px;
      backdrop-filter: blur(5px);
    }

    .bar-bg { width: 180px; height: 12px; background: #222; margin-top: 4px; border-radius: 3px; overflow: hidden; }
    .bar-fill { width: 100%; height: 100%; background: #ece8e1; transition: width 0.1s; }

    /* El Silahı Görseli */
    #weapon-viewmodel {
      position: absolute; bottom: 0; right: 15%;
      width: 250px; height: 180px;
      background: linear-gradient(135deg, #2b3a4a, #111822);
      border-top-left-radius: 20px;
      border-top: 4px solid #ff4655;
      border-left: 2px solid #ff4655;
      pointer-events: none; z-index: 9;
      display: flex; align-items: center; justify-content: center;
      color: #ff4655; font-weight: bold; font-size: 20px;
      box-shadow: -10px -10px 30px rgba(0,0,0,0.5);
      transition: transform 0.05s;
    }
    #weapon-viewmodel::after {
      content: 'VANDAL / CLASSIC';
      font-size: 10px; color: #8b978f; position: absolute; bottom: 10px;
    }

    /* Menü / Lobi / Harita Seçimi */
    #menu-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f1923, #1f2d3d);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; z-index: 30;
    }
    #menu-screen h1 { font-size: 52px; color: #ff4655; letter-spacing: 4px; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255,70,85,0.5); }
    #menu-screen p { color: #8b978f; margin-bottom: 30px; font-size: 16px; }

    .map-cards { display: flex; gap: 20px; margin-bottom: 30px; }
    .map-card {
      width: 220px; height: 130px; background: #22303c; border: 3px solid #2b3a4a;
      border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.2s;
    }
    .map-card:hover, .map-card.selected { border-color: #ff4655; background: #2b3a4a; transform: translateY(-5px); }
    .map-card h3 { color: white; font-size: 20px; }
    .map-card span { color: #ff4655; font-size: 12px; margin-top: 5px; }

    .play-btn {
      background: #ff4655; color: white; border: none; padding: 15px 40px;
      font-size: 20px; font-weight: bold; border-radius: 6px; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px; transition: background 0.2s;
      box-shadow: 0 0 15px rgba(255,70,85,0.4);
    }
    .play-btn:hover { background: #ff2336; }

    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="crosshair"></div>
    <div id="flash"></div>
    <div id="weapon-viewmodel">GUN</div>

    <div id="hud" style="display: none;">
      <div class="hud-box">
        <div style="font-size: 11px; color: #8b978f;">CAN / ZIRH</div>
        <div id="hp-text" style="font-size: 22px; font-weight: bold;">100 / 50</div>
        <div class="bar-bg"><div id="hp-bar" class="bar-fill" style="background:#ece8e1;"></div></div>
        <div class="bar-bg" style="margin-top:3px;"><div id="armor-bar" class="bar-fill" style="background:#00ffcc; width:100%;"></div></div>
      </div>

      <div class="hud-box" style="text-align: center;">
        <div style="font-size: 11px; color: #8b978f;">TAKIM DURUMU</div>
        <div style="font-size: 14px; margin-top:2px;">Müttefikler: <span id="ally-count" style="color:#00ffcc;">3</span> | Botlar: <span id="bot-count" style="color:#ff4655;">4</span></div>
        <div style="font-size: 10px; color: #8b978f; margin-top: 2px;">[Q] Duman | [E] Flaş | [R] Şarjör</div>
      </div>

      <div class="hud-box" style="text-align: right;">
        <div style="font-size: 11px; color: #8b978f;">MERMİ / SKOR</div>
        <div style="font-size: 22px; font-weight: bold;"><span id="ammo-text">25</span> / <span id="score-text" style="color: #ff4655;">0</span></div>
      </div>
    </div>

    <!-- Lobi ve Harita Seçim Ekranı -->
    <div id="menu-screen">
      <h1>VALORANT PROTOKOLÜ</h1>
      <p>Lütfen Harita Seçin ve Maça Katılın</p>
      
      <div class="map-cards">
        <div class="map-card selected" onclick="selectMap('split')">
          <h3>SPLIT</h3>
          <span>A/B Bölgeleri & Halatlar</span>
        </div>
        <div class="map-card" onclick="selectMap('bind')">
          <h3>BIND</h3>
          <span>Işınlayıcılar (Teleporter)</span>
        </div>
      </div>

      <button class="play-btn" onclick="startGame()">MAÇA BAŞLA</button>
    </div>
  </div>
